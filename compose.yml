services:
  minedash:
    image: maoraw/minedash:latest
    container_name: minedash
    ports:
      - "8214:8214"
    volumes:
      - /srv/minedash/app_data:/app/app_data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8214
    restart: unless-stopped
    networks:
      - your-minecraft-net

networks:
  your-minecraft-net:
    external: true
    name: your-minecraft-net